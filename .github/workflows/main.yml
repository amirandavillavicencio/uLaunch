
name: Build uLaunch

on: [workflow_dispatch, push, pull_request]

jobs:
  uLaunch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITA64: /opt/devkitpro/devkitA64

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Update packages and install Python
      run: |
        sudo -n apt-get update
        sudo -n apt-get install -y --no-install-recommends python-is-python3 python3-requests

    - name: Set workspace permissions
      run: chmod 777 -R "$GITHUB_WORKSPACE"
    
    - name: Prepare libnx
      run: |
        git clone https://github.com/switchbrew/libnx
        git -C libnx checkout b156b4774fb2df7b93402169509266da7547fc4c
        make -j$(nproc) -C libnx/
        cp -r libnx/nx/external/bsd/include libnx/nx
    
    - name: Compile
      run: |
        make -j$(nproc) LIBNX=$PWD/libnx/nx/ usystem
        cd SdOut
        cmp atmosphere/contents/0100000000001000/exefs.nsp ulaunch/bin/uSystem/exefs.nsp
        sha256sum atmosphere/contents/0100000000001000/exefs.nsp ulaunch/bin/uSystem/exefs.nsp > SHA256SUMS
        sha256sum -c SHA256SUMS
        
    - uses: actions/upload-artifact@v4
      with:
        name: experimental-uSystem
        path: SdOut/
        if-no-files-found: error
