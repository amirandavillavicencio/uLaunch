name: uMenu visible-cache build
on:
  push:
    branches: [switch-lite-umenu-visible-cache]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  umenu-visible-cache:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    env:
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 39fa538dbed279b9abb1fd72c7bf1e7f68cfaedf
          submodules: recursive
      - name: Prepare pinned libnx
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends python-is-python3 python3-requests
          chmod 777 -R "$GITHUB_WORKSPACE"
          git clone https://github.com/switchbrew/libnx
          git -C libnx checkout b156b4774fb2df7b93402169509266da7547fc4c
          make -j$(nproc) -C libnx/
          cp -r libnx/nx/external/bsd/include libnx/nx
      - name: Build uMenu
        run: make -j$(nproc) LIBNX=$PWD/libnx/nx/ umenu
      - name: Verify and package
        run: |
          mkdir -p out
          cp SdOut/ulaunch/bin/uMenu/main out/uMenu.nso
          cp SdOut/ulaunch/bin/uMenu/main.npdm out/uMenu.npdm
          cd out
          sha256sum * > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: umenu-visible-cache
          path: out/
          if-no-files-found: error
