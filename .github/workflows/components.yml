name: Switch Lite OS paired builds
on:
  workflow_dispatch:
  push:
    branches: [switch-lite-os-builds]
permissions:
  contents: read
env:
  DKP_IMG: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
jobs:
  module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [dmnt, frame, overlay]
        variant: [baseline, experimental]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned libnx for libstratosphere
        if: matrix.component != 'overlay'
        run: |
          docker build --build-arg DKP_BASE="$DKP_IMG" --iidfile "$RUNNER_TEMP/build-image" .github/switch-lite
          echo "DKP_IMG=$(cat "$RUNNER_TEMP/build-image")" >> "$GITHUB_ENV"
      - run: bash .github/switch-lite/build-${{ matrix.component }}.sh ${{ matrix.variant }}
      - run: cd out && sha256sum exefs.nsp > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-${{ matrix.variant }}
          path: out/
          if-no-files-found: error
  usystem:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    env:
      DEVKITA64: /opt/devkitpro/devkitA64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6e0e1de633eec601fb527aadb602abe3bc817541
          submodules: recursive
      - run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends python-is-python3 python3-requests
          chmod 777 -R "$GITHUB_WORKSPACE"
          git clone https://github.com/switchbrew/libnx
          git -C libnx checkout b156b4774fb2df7b93402169509266da7547fc4c
          make -j$(nproc) -C libnx/
          cp -r libnx/nx/external/bsd/include libnx/nx
          make -j$(nproc) LIBNX=$PWD/libnx/nx/ usystem
          mkdir out
          cp SdOut/ulaunch/bin/uSystem/exefs.nsp out/
          cd out && sha256sum exefs.nsp > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: usystem-baseline
          path: out/
          if-no-files-found: error
